<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14231c">
<title>Lorie's Mosquito Squashing Game</title>
<style>
  :root{
    --hud-h: 58px;
    --ink: #f2f7f4;
    --ink-dim: #9fb4ab;
    --panel: rgba(12,24,20,.88);
    --accent: #6ee7a8;
    --danger: #ff5d5d;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%;
    overflow:hidden;
    background:#0c1814;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    touch-action:none;
    overscroll-behavior:none;
  }

  /* ---------- HUD (fixed region, never overlaps play area) ---------- */
  #hud{
    flex:0 0 auto;
    padding-top:env(safe-area-inset-top);
    background:linear-gradient(#101f1a,#0c1814);
    border-bottom:1px solid rgba(110,231,168,.18);
    box-shadow:0 2px 10px rgba(0,0,0,.4);
    z-index:5;
  }
  #hudRow{
    height:var(--hud-h);
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
    padding:0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  }
  .hcell{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  .hlabel{ font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); }
  .hval{ font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;
         overflow:hidden; text-overflow:ellipsis; }
  #sceneName{ font-size:11px; font-weight:600; color:var(--accent); white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; }
  #healthCell{ align-items:flex-end; }
  #health{ display:flex; gap:3px; font-size:16px; line-height:1; }
  .drop{ width:11px; height:15px; position:relative; }
  .drop svg{ display:block; width:11px; height:15px; }
  #progWrap{ height:5px; background:rgba(255,255,255,.08); }
  #prog{ height:100%; width:0%; background:linear-gradient(90deg,#6ee7a8,#4dd4e0);
         transition:width .18s ease-out; }

  /* ---------- Stage ---------- */
  #stage{ flex:1 1 auto; position:relative; min-height:0;
          padding-bottom:env(safe-area-inset-bottom); background:#0c1814; }
  #game{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* ---------- Overlays ---------- */
  #overlay{
    position:absolute; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding:20px; text-align:center;
    background:radial-gradient(120% 80% at 50% 40%, rgba(6,16,13,.72), rgba(6,16,13,.94));
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  #overlay.hidden{ display:none; }
  .card{
    width:100%; max-width:340px;
    background:var(--panel);
    border:1px solid rgba(110,231,168,.28);
    border-radius:18px;
    padding:22px 20px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
  }
  .card h1{ font-size:26px; line-height:1.15; margin-bottom:4px; letter-spacing:-.01em; }
  .card h2{ font-size:21px; margin-bottom:8px; }
  .sub{ font-size:13px; color:var(--ink-dim); margin-bottom:14px; }
  .rules{ text-align:left; font-size:13.5px; line-height:1.55; margin:0 auto 16px;
          max-width:270px; color:#dfeae5; }
  .rules li{ list-style:none; margin-bottom:7px; padding-left:26px; position:relative; }
  .rules li span{ position:absolute; left:0; top:-1px; font-size:15px; }
  .stats{ display:flex; justify-content:center; gap:22px; margin:12px 0 16px; }
  .stat b{ display:block; font-size:24px; font-variant-numeric:tabular-nums; }
  .stat i{ font-style:normal; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
           color:var(--ink-dim); }
  .btn{
    -webkit-appearance:none; appearance:none; border:0; cursor:pointer;
    display:block; width:100%; min-height:56px;
    border-radius:14px;
    background:linear-gradient(#6ee7a8,#37c98a);
    color:#062018; font-size:18px; font-weight:800; letter-spacing:.02em;
    font-family:inherit; touch-action:manipulation;
    box-shadow:0 6px 0 #1f8e60, 0 10px 22px rgba(0,0,0,.4);
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 3px 0 #1f8e60, 0 6px 14px rgba(0,0,0,.4); }
  .btn.ghost{ background:transparent; color:var(--ink-dim); box-shadow:none;
              border:1px solid rgba(255,255,255,.18); min-height:46px; font-size:14px;
              font-weight:600; margin-top:10px; }
  .curve{ font-size:11px; line-height:1.5; color:var(--ink-dim); margin-top:14px;
          border-top:1px solid rgba(255,255,255,.1); padding-top:12px; text-align:left; }
  .curve code{ font-family:ui-monospace,Menlo,Consolas,monospace; color:#bfe9d4; font-size:10.5px; }
  .tag{ display:inline-block; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
        color:var(--accent); margin-bottom:8px; }
</style>
</head>
<body>

<header id="hud">
  <div id="hudRow">
    <div class="hcell" style="flex:1 1 auto">
      <span class="hlabel">Level <span id="lvlNum">1</span>/8</span>
      <span id="sceneName">Amsterdam Canal</span>
    </div>
    <div class="hcell" style="flex:0 0 auto; align-items:center">
      <span class="hlabel">Score</span>
      <span class="hval" id="score">0</span>
    </div>
    <div class="hcell" id="healthCell" style="flex:0 0 auto">
      <span class="hlabel">Blood</span>
      <div id="health"></div>
    </div>
  </div>
  <div id="progWrap"><div id="prog"></div></div>
</header>

<main id="stage">
  <canvas id="game"></canvas>

  <div id="overlay">
    <div class="card" id="card"></div>
  </div>
</main>

<script>
"use strict";
(function () {

/* =========================================================================
   Lorie's Mosquito Squashing Game
   Single file. Canvas 2D. No dependencies. Portrait mobile first.
   ========================================================================= */

// ---------------------------------------------------------------- constants
var TOTAL_LEVELS = 8;
var MAX_HEALTH   = 5;
var HIT_RADIUS   = 34;   // CSS px -> 68px touch diameter, well over the 44pt minimum

var SCENES = [
  { key:'amsterdam', name:'Amsterdam Canal'      },
  { key:'lakefront', name:'Minnesota Lakefront'  },
  { key:'campground',name:'Campground'           },
  { key:'treehouse', name:'Treehouse'            }
];

/* Difficulty curve — every value below is a stated formula of the level L (1-8).
   Shown to the player on the title card so nothing is hidden. */
function levelConfig(L){
  var i = L - 1;
  return {
    quota:      5 + 2 * i,                        // mosquitoes to squash
    speed:      55 + 20 * i,                      // px/sec cruising speed
    concurrent: Math.min(2 + Math.floor(i * 0.8), 7),
    spawnGap:   Math.max(0.35, 1.40 - 0.14 * i),  // sec between spawns
    biteTime:   Math.max(1.00, 2.40 - 0.18 * i),  // sec to swat a biter
    wander:     Math.max(0.60, 2.60 - 0.25 * i)   // sec of free flight before it dives
  };
}

// ---------------------------------------------------------------- elements
var canvas  = document.getElementById('game');
var ctx     = canvas.getContext('2d');
var overlay = document.getElementById('overlay');
var card    = document.getElementById('card');
var elScore = document.getElementById('score');
var elLvl   = document.getElementById('lvlNum');
var elScene = document.getElementById('sceneName');
var elHealth= document.getElementById('health');
var elProg  = document.getElementById('prog');

// ---------------------------------------------------------------- state
var W = 0, H = 0, dpr = 1;
var bg = document.createElement('canvas');   // cached scene painting
var bgCtx = bg.getContext('2d');
var bgKey = '';

var state = 'title';   // title | playing | levelclear | gameover | win | paused
var level = 1, score = 0, health = MAX_HEALTH;
var squashed = 0, combo = 0, bestCombo = 0, totalSquashed = 0, bitesTaken = 0;
var cfg = levelConfig(1);
var mosquitoes = [], fx = [];
var spawnTimer = 0, armFlash = 0, shake = 0, sceneFade = 0;
var lastT = 0, rafId = 0;

/* The forearm rests across the lower play area: the thing being bitten.
   Its bite zone is deliberately held well clear of the bottom edge, because
   iOS Safari's toolbar chrome swallows touches in the last ~60px. */
var arm = { x:0, y:0, w:0, h:0, biteX:0, biteY:0, biteRX:0, biteRY:0 };

// ---------------------------------------------------------------- sizing
var stageEl = document.getElementById('stage');

function resize(){
  var r = stageEl.getBoundingClientRect();
  var nw = Math.max(1, Math.round(r.width  || stageEl.clientWidth));
  var nh = Math.max(1, Math.round(r.height || stageEl.clientHeight));
  if (nw === W && nh === H && canvas.width > 1) return;

  W = nw; H = nh;
  dpr = Math.min(window.devicePixelRatio || 1, 3);

  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  bg.width  = canvas.width;
  bg.height = canvas.height;

  // A forearm laid across the lower screen, running off both edges.
  arm.h = Math.min(58, H * 0.078);             // half-thickness of the forearm
  arm.x = W / 2;
  arm.y = H - Math.max(120, H * 0.17);         // centreline, always clear of the edge
  arm.w = W;

  arm.biteX  = W * 0.46;
  arm.biteY  = arm.y - arm.h * 0.10;
  arm.biteRX = W * 0.32;
  arm.biteRY = arm.h * 0.52;

  bgKey = '';                        // force a scene repaint at the new size
  if (state !== 'playing') draw();   // keep the frozen frame correct
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 260); });

/* getBoundingClientRect can legitimately read 0 during first layout (and Safari
   re-lays-out when the URL bar collapses). Observe the stage instead of trusting
   one measurement, and keep a cheap per-frame check as the final backstop. */
if (window.ResizeObserver){
  try { new ResizeObserver(resize).observe(stageEl); } catch (e) { /* older Safari */ }
}
window.addEventListener('load', resize);
window.addEventListener('pageshow', resize);
setTimeout(resize, 0);
setTimeout(resize, 250);

// ================================================================= SCENES
function paintScene(){
  var key = level + 'x' + W + 'x' + H;
  if (key === bgKey) return;
  bgKey = key;

  var g = bgCtx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  var idx  = (level - 1) % SCENES.length;
  var dusk = level > SCENES.length;           // second pass through = evening

  if      (idx === 0) sceneAmsterdam(g, dusk);
  else if (idx === 1) sceneLakefront(g, dusk);
  else if (idx === 2) sceneCampground(g, dusk);
  else                sceneTreehouse(g, dusk);

  // The campground is already a night scene; washing it again just makes mud,
  // so it gets a colder pre-dawn tint on the second pass instead.
  if (dusk) (idx === 2) ? midnightWash(g) : duskWash(g);
}

function grad(g, x0,y0,x1,y1, stops){
  var lg = g.createLinearGradient(x0,y0,x1,y1);
  for (var i=0;i<stops.length;i++) lg.addColorStop(stops[i][0], stops[i][1]);
  return lg;
}
function duskWash(g){
  // Kept deliberately light: a heavy multiply crushes every scene to black
  // and the mosquitoes stop reading against it.
  g.save();
  g.globalCompositeOperation = 'multiply';
  g.globalAlpha = 0.62;
  g.fillStyle = grad(g,0,0,0,H,[[0,'#7d72b8'],[0.55,'#a294c2'],[1,'#8177a8']]);
  g.fillRect(0,0,W,H);
  g.restore();

  // warm band on the horizon, where the sun just went down
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = grad(g,0,H*0.30,0,H*0.66,
    [[0,'rgba(255,150,60,0)'],[0.55,'rgba(255,150,60,.16)'],[1,'rgba(255,120,50,0)']]);
  g.fillRect(0, H*0.30, W, H*0.36);
  g.restore();

  starfield(g, 44, H*0.32);
}

/* The campground is the one scene the player sees twice with identical
   geometry, so its second pass has to shift hard — a cold blue pre-dawn with
   a band of first light on the horizon, not just a slightly darker night. */
function midnightWash(g){
  g.save();
  g.globalCompositeOperation = 'multiply';
  g.globalAlpha = 0.72;
  g.fillStyle = grad(g,0,0,0,H,[[0,'#3550a8'],[0.5,'#4a6ec0'],[1,'#2f4a86']]);
  g.fillRect(0,0,W,H);
  g.restore();

  // first light along the treeline
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = grad(g,0,H*0.34,0,H*0.62,
    [[0,'rgba(120,150,255,0)'],[0.7,'rgba(150,175,255,.30)'],[1,'rgba(255,190,140,.16)']]);
  g.fillRect(0, H*0.34, W, H*0.28);
  g.restore();

  starfield(g, 26, H*0.24);
}

function starfield(g, n, maxY){
  g.fillStyle = 'rgba(255,255,235,0.9)';
  for (var i = 0; i < n; i++){
    var x = (i * 97.3 % W), y = (i * 53.7 % maxY);
    var s = (i % 3 === 0) ? 1.6 : 1.0;
    g.globalAlpha = 0.35 + (i % 5) * 0.13;
    g.fillRect(x, y, s, s);
  }
  g.globalAlpha = 1;
}

/* ---- 1. Amsterdam: canal, gabled row houses, bridge, bike ---- */
function sceneAmsterdam(g, dusk){
  g.fillStyle = grad(g,0,0,0,H,[[0,'#9fc3dd'],[0.45,'#cfdfe8'],[0.62,'#e7e2d6']]);
  g.fillRect(0,0,W,H);

  // soft clouds
  g.fillStyle='rgba(255,255,255,.55)';
  for (var c=0;c<5;c++){
    var cx=(c*151%W), cy=H*0.06+ (c%3)*H*0.05, rr=W*0.10+(c%2)*W*0.05;
    g.beginPath();
    g.arc(cx,cy,rr*0.6,0,6.284); g.arc(cx+rr*0.5,cy+4,rr*0.45,0,6.284);
    g.arc(cx-rr*0.5,cy+6,rr*0.4,0,6.284); g.fill();
  }

  var quayY  = H*0.62;   // top of the quay wall / base of the houses
  var elmY   = quayY;

  /* Amsterdam canal houses: narrow, tall-ish but not skyscrapers, packed
     shoulder to shoulder, each topped with a stepped or bell gable. The gable
     is the whole silhouette, so it is drawn large relative to the facade. */
  var palette = ['#8c4f3e','#a2604a','#6a4535','#b4795a','#7a4a39','#9c6650',
                 '#5c3f31','#8f5643','#a97253'];
  var x = -12, i = 0;
  while (x < W + 16){
    var bw  = 30 + (i * 11 % 20);            // 30-49px wide: narrow plots
    var bh  = H * 0.155 + (i * 23 % (H * 0.075));
    var top = quayY - bh;

    g.fillStyle = palette[i % palette.length];
    g.fillRect(x, top, bw, bh);

    // gable
    var gh = 16 + (i * 7 % 10);
    g.beginPath();
    if (i % 3 === 0){                         // stepped gable
      var steps = 3, sw = bw / (steps * 2 + 1);
      g.moveTo(x, top);
      for (var s2 = 0; s2 < steps; s2++){
        g.lineTo(x + s2 * sw,        top - gh * (s2 + 1) / steps);
        g.lineTo(x + (s2 + 1) * sw,  top - gh * (s2 + 1) / steps);
      }
      g.lineTo(x + bw - steps * sw, top - gh);
      for (var s3 = steps - 1; s3 >= 0; s3--){
        g.lineTo(x + bw - s3 * sw,       top - gh * (s3 + 1) / steps);
        g.lineTo(x + bw - s3 * sw,       top - gh * s3 / steps);
      }
      g.lineTo(x + bw, top);
    } else if (i % 3 === 1){                  // bell gable
      g.moveTo(x, top);
      g.quadraticCurveTo(x + bw * 0.04, top - gh * 0.55, x + bw * 0.30, top - gh * 0.72);
      g.quadraticCurveTo(x + bw * 0.50, top - gh * 1.25, x + bw * 0.70, top - gh * 0.72);
      g.quadraticCurveTo(x + bw * 0.96, top - gh * 0.55, x + bw, top);
    } else {                                  // neck / spout gable
      g.moveTo(x, top);
      g.lineTo(x, top - gh * 0.45);
      g.lineTo(x + bw * 0.28, top - gh * 0.45);
      g.lineTo(x + bw * 0.28, top - gh);
      g.lineTo(x + bw * 0.72, top - gh);
      g.lineTo(x + bw * 0.72, top - gh * 0.45);
      g.lineTo(x + bw, top - gh * 0.45);
      g.lineTo(x + bw, top);
    }
    g.closePath(); g.fill();

    // white sandstone trim along the gable, very Dutch
    g.strokeStyle = 'rgba(246,240,230,.75)'; g.lineWidth = 1.6; g.stroke();

    // hoisting beam poking out of the gable peak
    g.strokeStyle = '#2f2620'; g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x + bw * 0.5, top - gh * 0.55);
    g.lineTo(x + bw * 0.5, top - gh * 0.95);
    g.stroke();

    // tall narrow windows, two per floor
    var lit = dusk;
    for (var wy = top + 9; wy < quayY - 26; wy += 20){
      for (var col = 0; col < 2; col++){
        var wx = x + bw * (col ? 0.56 : 0.16);
        var ww = bw * 0.28;
        g.fillStyle = (lit && ((i + col + Math.floor(wy)) % 3 !== 0))
                      ? 'rgba(255,206,120,.95)' : 'rgba(214,228,238,.88)';
        g.fillRect(wx, wy, ww, 13);
        g.fillStyle = 'rgba(60,40,30,.45)';
        g.fillRect(wx, wy + 6, ww, 1);
        g.fillRect(wx + ww / 2 - 0.5, wy, 1, 13);
      }
    }
    // door
    g.fillStyle = 'rgba(48,32,24,.85)';
    g.fillRect(x + bw * 0.34, quayY - 22, bw * 0.32, 22);

    g.fillStyle = 'rgba(0,0,0,.18)';
    g.fillRect(x + bw - 1.5, top - 4, 1.5, bh + 4);   // seam between plots
    x += bw; i++;
  }

  // elm trees along the quay
  for (var tI = 0; tI < 3; tI++){
    var tx = W * (0.14 + tI * 0.34);
    g.strokeStyle = '#4a382a'; g.lineWidth = 5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(tx, elmY); g.lineTo(tx, elmY - 44); g.stroke();
    g.fillStyle = 'rgba(74,110,62,.92)';
    g.beginPath(); g.arc(tx, elmY - 56, 19, 0, 6.284); g.fill();
    g.beginPath(); g.arc(tx - 13, elmY - 47, 13, 0, 6.284); g.fill();
    g.beginPath(); g.arc(tx + 13, elmY - 48, 12, 0, 6.284); g.fill();
  }

  // quay wall
  g.fillStyle = '#5a4b3e'; g.fillRect(0, quayY, W, 12);
  g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(0, quayY + 10, W, 3);

  // canal water
  var waterTop = quayY + 12;
  var waterFill = grad(g, 0, waterTop, 0, H, [[0,'#3d6c78'],[0.5,'#2c5665'],[1,'#1d3c48']]);
  g.fillStyle = waterFill;
  g.fillRect(0, waterTop, W, H - waterTop);

  // wobbly reflections of the houses
  g.save();
  g.globalAlpha = 0.16;
  for (var rf = 0; rf < 22; rf++){
    g.fillStyle = palette[rf % palette.length];
    g.fillRect((rf * 31) % W, waterTop + (rf % 7) * 9, 22, 6);
  }
  g.restore();
  g.globalAlpha = 0.15; g.fillStyle = '#fff';
  for (var r = 0; r < 14; r++){
    var ry = waterTop + 10 + r * ((H - waterTop) / 15);
    g.fillRect((r * 61) % W - 30, ry, 55 + (r % 4) * 26, 2);
  }
  g.globalAlpha = 1;

  /* Arched bridge crossing the canal just below the quay. The arch opening is
     re-filled with the very same water gradient object, so the hole lines up
     with the canal exactly instead of being a pasted-on patch. */
  var bx0 = -8, bx1 = W * 0.66;
  var bTop = waterTop + 2, bBot = waterTop + 30;
  var springY = bBot, archH = 19;

  g.fillStyle = '#8a7663';
  g.fillRect(bx0, bTop, bx1 - bx0, bBot - bTop);

  g.fillStyle = waterFill;                     // punch the arch through
  g.beginPath();
  g.moveTo(bx0 + 16, springY);
  g.quadraticCurveTo((bx0 + bx1) / 2, springY - archH * 2.1, bx1 - 16, springY);
  g.closePath();
  g.fill();

  g.fillStyle = 'rgba(0,0,0,.16)';             // shaded underside of the arch
  g.beginPath();
  g.moveTo(bx0 + 16, springY);
  g.quadraticCurveTo((bx0 + bx1) / 2, springY - archH * 2.1, bx1 - 16, springY);
  g.lineTo(bx1 - 20, springY);
  g.quadraticCurveTo((bx0 + bx1) / 2, springY - archH * 1.7, bx0 + 20, springY);
  g.closePath();
  g.fill();

  // deck cap and railing
  g.fillStyle = '#9c876f'; g.fillRect(bx0, bTop, bx1 - bx0, 5);
  g.strokeStyle = '#6a5a4a'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(bx0, bTop - 13); g.lineTo(bx1, bTop - 13); g.stroke();
  for (var bp = 0; bp < 10; bp++){
    var bpx = bx0 + (bx1 - bx0) * (bp / 9);
    g.beginPath(); g.moveTo(bpx, bTop - 13); g.lineTo(bpx, bTop); g.stroke();
  }

  // bicycle leaning on the quay railing
  bike(g, W * 0.86, quayY, 26, '#22201e');
}
function bike(g, cx, baseY, R, col){
  g.strokeStyle = col; g.lineWidth = 2.4; g.lineCap='round';
  g.beginPath(); g.arc(cx-R*0.8, baseY-R*0.5, R*0.5, 0, 6.284); g.stroke();
  g.beginPath(); g.arc(cx+R*0.8, baseY-R*0.5, R*0.5, 0, 6.284); g.stroke();
  g.beginPath();
  g.moveTo(cx-R*0.8, baseY-R*0.5); g.lineTo(cx-R*0.1, baseY-R*1.15);
  g.lineTo(cx+R*0.55, baseY-R*1.15); g.lineTo(cx+R*0.8, baseY-R*0.5);
  g.moveTo(cx-R*0.1, baseY-R*1.15); g.lineTo(cx+R*0.15, baseY-R*0.5);
  g.moveTo(cx+R*0.55,baseY-R*1.15); g.lineTo(cx+R*0.62, baseY-R*1.5);
  g.moveTo(cx-R*0.1, baseY-R*1.15); g.lineTo(cx-R*0.35,baseY-R*1.45);
  g.stroke();
}

/* ---- 2. Minnesota lakefront: pines, lake, dock, loon, cattails ---- */
function sceneLakefront(g, dusk){
  var horizon = H*0.44;
  g.fillStyle = grad(g,0,0,0,horizon,[[0,'#5aa7d8'],[0.6,'#a8d3ea'],[1,'#e6d9b8']]);
  g.fillRect(0,0,W,horizon);

  // far treeline of pines
  var baseY = horizon;
  for (var pass=0; pass<2; pass++){
    var col = pass===0 ? '#22503f' : '#173b2f';
    var yOff = pass===0 ? -6 : 0;
    g.fillStyle = col;
    for (var t=-1; t*26 < W+30; t++){
      var px = t*26 + (pass?13:0);
      var ph = 34 + ((t*17 + pass*7) % 30);
      g.beginPath();
      g.moveTo(px, baseY+yOff);
      g.lineTo(px+13, baseY+yOff-ph);
      g.lineTo(px+26, baseY+yOff);
      g.closePath(); g.fill();
    }
  }

  // lake
  g.fillStyle = grad(g,0,horizon,0,H,[[0,'#2e6f8f'],[0.45,'#245a78'],[1,'#12384f']]);
  g.fillRect(0,horizon,W,H-horizon);
  g.globalAlpha=.20; g.fillStyle='#dff2ff';
  for (var s=0;s<22;s++){
    var sy = horizon + 8 + s*((H-horizon)/23);
    g.fillRect((s*73)%W - 40, sy, 50 + (s%5)*30, 2);
  }
  g.globalAlpha=1;

  // sun glint column
  g.globalAlpha=.13; g.fillStyle='#ffe9b0';
  g.fillRect(W*0.60, horizon, W*0.12, H-horizon);
  g.globalAlpha=1;

  // wooden dock running toward the viewer
  var dTop = horizon + 14, dBot = H*0.88;
  g.fillStyle = '#7d5c3c';
  g.beginPath();
  g.moveTo(W*0.16, dBot); g.lineTo(W*0.34, dTop);
  g.lineTo(W*0.50, dTop); g.lineTo(W*0.52, dBot);
  g.closePath(); g.fill();
  g.strokeStyle='rgba(0,0,0,.22)'; g.lineWidth=1.6;
  for (var k=0;k<9;k++){
    var f=k/9, yy=dTop+(dBot-dTop)*f;
    g.beginPath();
    g.moveTo(W*0.34 - (W*0.18)*f, yy);
    g.lineTo(W*0.50 + (W*0.02)*f, yy);
    g.stroke();
  }
  g.fillStyle='#5b4028';
  g.fillRect(W*0.31, dTop+8, 5, 26);
  g.fillRect(W*0.24, dTop+((dBot-dTop)*0.45), 6, 34);

  // loon on the water
  g.fillStyle='#101418';
  g.beginPath(); g.ellipse(W*0.76, horizon+H*0.10, 15, 6, 0, 0, 6.284); g.fill();
  g.beginPath(); g.ellipse(W*0.83, horizon+H*0.075, 5.5, 6.5, 0, 0, 6.284); g.fill();
  g.beginPath();
  g.moveTo(W*0.865, horizon+H*0.073); g.lineTo(W*0.90, horizon+H*0.079);
  g.lineTo(W*0.865, horizon+H*0.085); g.closePath(); g.fill();

  // cattails in the foreground
  cattail(g, W*0.06, H*0.99, 66);
  cattail(g, W*0.14, H*0.99, 50);
  cattail(g, W*0.92, H*0.99, 74);
}
function cattail(g, x, y, h){
  g.strokeStyle='#3f6b3a'; g.lineWidth=2.4; g.lineCap='round';
  g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x-5, y-h*0.6, x-2, y-h); g.stroke();
  g.fillStyle='#5a3a22';
  g.beginPath(); g.ellipse(x-2, y-h-6, 4.2, 10, 0, 0, 6.284); g.fill();
  g.strokeStyle='#4b7d44'; g.lineWidth=3;
  g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+16, y-h*0.55, x+6, y-h*0.85); g.stroke();
}

/* ---- 3. Campground: night forest, tent, campfire, stumps ---- */
function sceneCampground(g, dusk){
  g.fillStyle = grad(g,0,0,0,H,[[0,'#16283b'],[0.42,'#22414a'],[0.66,'#2c4038'],[1,'#1c2a20']]);
  g.fillRect(0,0,W,H);

  // stars (always — it is a night scene)
  g.fillStyle='rgba(255,255,240,.9)';
  for (var i=0;i<70;i++){
    var sx=(i*83.1%W), sy=(i*41.3%(H*0.42));
    g.globalAlpha=.25+(i%6)*0.12;
    g.fillRect(sx,sy,(i%4===0)?1.8:1,(i%4===0)?1.8:1);
  }
  g.globalAlpha=1;

  // moon — crossed the sky by the second visit
  var moonX = dusk ? W*0.20 : W*0.78;
  g.fillStyle='rgba(255,250,225,.92)';
  g.beginPath(); g.arc(moonX, H*0.11, 20, 0, 6.284); g.fill();
  g.fillStyle='rgba(255,250,225,.13)';
  g.beginPath(); g.arc(moonX, H*0.11, 34, 0, 6.284); g.fill();

  // dense pine wall
  var groundY = H*0.60;
  for (var pass=0; pass<2; pass++){
    g.fillStyle = pass===0 ? '#12291f' : '#0b1c16';
    for (var t=-1; t*22 < W+26; t++){
      var px=t*22 + (pass?11:0);
      var ph=52 + ((t*23+pass*11)%64);
      g.beginPath();
      g.moveTo(px, groundY + (pass?4:0));
      g.lineTo(px+11, groundY - ph);
      g.lineTo(px+22, groundY + (pass?4:0));
      g.closePath(); g.fill();
    }
  }

  // ground
  g.fillStyle = grad(g,0,groundY,0,H,[[0,'#2e3a26'],[1,'#1a2318']]);
  g.fillRect(0, groundY, W, H-groundY);

  // tent
  var tx=W*0.22, ty=groundY+H*0.13, tw=W*0.34, th=H*0.13;
  g.fillStyle='#b8523f';
  g.beginPath();
  g.moveTo(tx-tw/2, ty); g.lineTo(tx, ty-th); g.lineTo(tx+tw/2, ty);
  g.closePath(); g.fill();
  g.fillStyle='#2a1512';
  g.beginPath();
  g.moveTo(tx-tw*0.16, ty); g.lineTo(tx, ty-th*0.78); g.lineTo(tx+tw*0.16, ty);
  g.closePath(); g.fill();
  g.strokeStyle='#8c3a2b'; g.lineWidth=2;
  g.beginPath(); g.moveTo(tx, ty-th); g.lineTo(tx+tw*0.42, ty-th*0.15); g.stroke();

  // campfire + glow — burned down to embers on the second visit
  var fire = dusk ? 0.42 : 1;
  var fx0=W*0.70, fy0=groundY+H*0.17;
  var rg=g.createRadialGradient(fx0,fy0,4,fx0,fy0,W*0.40);
  rg.addColorStop(0,'rgba(255,168,64,' + (0.50*fire) + ')');
  rg.addColorStop(0.5,'rgba(255,120,40,' + (0.14*fire) + ')');
  rg.addColorStop(1,'rgba(255,120,40,0)');
  g.fillStyle=rg; g.beginPath(); g.arc(fx0,fy0,W*0.40,0,6.284); g.fill();
  g.strokeStyle='#4b3524'; g.lineWidth=5; g.lineCap='round';
  g.beginPath(); g.moveTo(fx0-20,fy0+4); g.lineTo(fx0+16,fy0-6); g.stroke();
  g.beginPath(); g.moveTo(fx0+20,fy0+4); g.lineTo(fx0-14,fy0-6); g.stroke();
  g.fillStyle='#ffb03a';
  g.beginPath();
  g.moveTo(fx0-13*fire,fy0); g.quadraticCurveTo(fx0-5*fire,fy0-24*fire, fx0+1,fy0-34*fire);
  g.quadraticCurveTo(fx0+9*fire,fy0-18*fire, fx0+13*fire,fy0); g.closePath(); g.fill();
  g.fillStyle='#ffe27a';
  g.beginPath();
  g.moveTo(fx0-6*fire,fy0); g.quadraticCurveTo(fx0-2*fire,fy0-14*fire, fx0+1,fy0-21*fire);
  g.quadraticCurveTo(fx0+6*fire,fy0-11*fire, fx0+7*fire,fy0); g.closePath(); g.fill();

  // stumps
  g.fillStyle='#4a3728';
  g.fillRect(W*0.86, fy0-8, 26, 22);
  g.fillStyle='#66513c';
  g.beginPath(); g.ellipse(W*0.86+13, fy0-8, 13, 5, 0, 0, 6.284); g.fill();
}

/* ---- 4. Treehouse: canopy, trunk, plank deck, rope ladder ---- */
function sceneTreehouse(g, dusk){
  g.fillStyle = grad(g,0,0,0,H,[[0,'#c9e6a8'],[0.35,'#8fc47a'],[0.75,'#4b8a55'],[1,'#2c5a3c']]);
  g.fillRect(0,0,W,H);

  // shafts of light
  g.save(); g.globalAlpha=.16; g.fillStyle='#fffbd0';
  for (var b=0;b<4;b++){
    g.beginPath();
    g.moveTo(W*(0.12+b*0.22), 0);
    g.lineTo(W*(0.24+b*0.22), 0);
    g.lineTo(W*(0.42+b*0.22), H*0.72);
    g.lineTo(W*(0.20+b*0.22), H*0.72);
    g.closePath(); g.fill();
  }
  g.restore();

  // layered leaf canopy across the top
  var leafCols = ['#2f6b3d','#3d8049','#569a56','#25563a'];
  for (var layer=0; layer<4; layer++){
    g.fillStyle = leafCols[layer];
    var yBase = H*(0.05 + layer*0.055);
    for (var n=0; n<16; n++){
      var lx = (n*W/15 + layer*19) % (W+50) - 25;
      var ly = yBase + ((n*layer*13) % 26);
      g.beginPath();
      g.ellipse(lx, ly, 34-layer*3, 19-layer*2, (n%2?0.5:-0.4), 0, 6.284);
      g.fill();
    }
  }

  // trunk on the right
  var trunkX = W*0.78, trunkW = W*0.20;
  g.fillStyle='#6b4a2f'; g.fillRect(trunkX, 0, trunkW, H*0.90);
  g.fillStyle='rgba(0,0,0,.20)';
  for (var v=0; v<7; v++) g.fillRect(trunkX + 5 + v*(trunkW/7), 0, 3, H*0.90);
  g.fillStyle='#5a3d26';
  g.beginPath(); g.ellipse(trunkX+trunkW*0.45, H*0.30, 13, 20, 0, 0, 6.284); g.fill();

  // branch to the left
  g.strokeStyle='#6b4a2f'; g.lineWidth=15; g.lineCap='round';
  g.beginPath();
  g.moveTo(trunkX+4, H*0.22);
  g.quadraticCurveTo(W*0.42, H*0.17, W*0.06, H*0.27);
  g.stroke();

  // plank deck across the bottom
  var deckY = H*0.82;
  g.fillStyle='#8a6039'; g.fillRect(0, deckY, W, H-deckY);
  g.strokeStyle='rgba(60,36,18,.55)'; g.lineWidth=2;
  for (var p=0; p<8; p++){
    var py = deckY + p*((H-deckY)/7);
    g.beginPath(); g.moveTo(0,py); g.lineTo(W,py); g.stroke();
  }
  g.fillStyle='rgba(0,0,0,.22)'; g.fillRect(0, deckY-4, W, 4);

  // rail posts
  g.fillStyle='#6f4a2b';
  g.fillRect(W*0.10, deckY-46, 9, 46);
  g.fillRect(W*0.40, deckY-46, 9, 46);
  g.fillStyle='#7d5433';
  g.fillRect(0, deckY-46, W*0.55, 8);

  // rope ladder
  g.strokeStyle='#c8ab77'; g.lineWidth=3;
  g.beginPath(); g.moveTo(W*0.20, deckY); g.lineTo(W*0.185, H); g.stroke();
  g.beginPath(); g.moveTo(W*0.30, deckY); g.lineTo(W*0.315, H); g.stroke();
  for (var rung=0; rung<3; rung++){
    var ry2 = deckY + 14 + rung*20;
    if (ry2 > H) break;
    g.beginPath(); g.moveTo(W*0.195, ry2); g.lineTo(W*0.307, ry2); g.stroke();
  }
}

// ================================================================= ENTITIES
function spawnMosquito(){
  // enter from a random edge, biased to the top half where there is room to fly
  var side = Math.random();
  var x, y;
  if (side < 0.45)      { x = Math.random()*W;  y = -26; }
  else if (side < 0.72) { x = -26;              y = Math.random()*H*0.6; }
  else                  { x = W + 26;           y = Math.random()*H*0.6; }

  var ang = Math.random() * Math.PI * 2;
  mosquitoes.push({
    x:x, y:y,
    vx: Math.cos(ang) * cfg.speed,
    vy: Math.sin(ang) * cfg.speed,
    phase: Math.random() * 6.283,
    wobble: 0.9 + Math.random() * 0.8,
    mode: 'fly',
    t: cfg.wander * (0.7 + Math.random() * 0.6),
    biteT: 0,
    dead: false,
    scale: 0,                     // pops in so it is never a surprise pixel
    wing: Math.random() * 6.283
  });
}

function updateMosquitoes(dt){
  for (var i = mosquitoes.length - 1; i >= 0; i--){
    var m = mosquitoes[i];
    m.scale = Math.min(1, m.scale + dt * 4);
    m.wing += dt * 34;
    m.phase += dt * m.wobble * 3.4;

    if (m.mode === 'fly'){
      // wandering drift + sine wobble, the classic insect flight read
      m.vx += Math.cos(m.phase) * 34 * dt;
      m.vy += Math.sin(m.phase * 1.31) * 34 * dt;
      var sp = Math.hypot(m.vx, m.vy) || 1;
      m.vx = m.vx / sp * cfg.speed;
      m.vy = m.vy / sp * cfg.speed;
      m.x += m.vx * dt;
      m.y += m.vy * dt;

      // bounce off the play area with a margin so it never hides under an edge
      var pad = 18;
      if (m.x < pad)      { m.x = pad;      m.vx =  Math.abs(m.vx); }
      if (m.x > W - pad)  { m.x = W - pad;  m.vx = -Math.abs(m.vx); }
      if (m.y < pad)      { m.y = pad;      m.vy =  Math.abs(m.vy); }
      if (m.y > H - pad)  { m.y = H - pad;  m.vy = -Math.abs(m.vy); }

      m.t -= dt;
      if (m.t <= 0){
        m.mode = 'dive';
        var a = Math.random() * 6.283, rr = Math.sqrt(Math.random());
        m.tx = arm.biteX + Math.cos(a) * arm.biteRX * rr;
        m.ty = arm.biteY + Math.sin(a) * arm.biteRY * rr;
      }

    } else if (m.mode === 'dive'){
      var dx = m.tx - m.x, dy = m.ty - m.y;
      var d = Math.hypot(dx, dy) || 1;
      var sp2 = cfg.speed * 1.15;
      m.x += dx / d * sp2 * dt;
      m.y += dy / d * sp2 * dt;
      if (d < 6){ m.mode = 'bite'; m.biteT = cfg.biteTime; }

    } else if (m.mode === 'bite'){
      m.biteT -= dt;
      m.x = m.tx + Math.cos(m.phase * 2) * 1.6;
      m.y = m.ty + Math.sin(m.phase * 2) * 1.2;
      if (m.biteT <= 0){
        takeBite(m);
        m.mode = 'flee';
        m.vx = (Math.random() - 0.5) * cfg.speed * 2;
        m.vy = -cfg.speed * 1.7;
      }

    } else { // flee
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if (m.y < -60 || m.x < -60 || m.x > W + 60) mosquitoes.splice(i, 1);
    }
  }
}

function takeBite(m){
  health--;
  bitesTaken++;
  combo = 0;
  armFlash = 0.45;
  shake = 9;
  burst(m.x, m.y, '#c9384a', 12);
  renderHealth();
  if (health <= 0) endGame(false);
}

function squash(m){
  m.dead = true;
  combo++;
  if (combo > bestCombo) bestCombo = combo;
  squashed++;
  totalSquashed++;

  var mult  = Math.min(1 + (combo - 1) * 0.1, 3);      // combo caps at x3
  var bonus = (m.mode === 'bite') ? 1.5 : 1;           // swatting a biter pays more
  var gained = Math.round(10 * level * mult * bonus);
  score += gained;

  burst(m.x, m.y, '#d8465c', 16);
  fx.push({ kind:'ring', x:m.x, y:m.y, t:0, life:0.34 });
  fx.push({ kind:'text', x:m.x, y:m.y - 16, t:0, life:0.75,
            s:'+' + gained + (combo > 2 ? '  x' + mult.toFixed(1) : '') });
  shake = Math.max(shake, 4);

  elScore.textContent = score;
  updateProgress();
  if (squashed >= cfg.quota) levelClear();
}

function burst(x, y, col, n){
  for (var i = 0; i < n; i++){
    var a = Math.random() * 6.283, s = 60 + Math.random() * 190;
    fx.push({ kind:'dot', x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
              t:0, life:0.4 + Math.random()*0.3, col:col,
              r:1.6 + Math.random()*2.6 });
  }
}

function updateFx(dt){
  for (var i = fx.length - 1; i >= 0; i--){
    var f = fx[i];
    f.t += dt;
    if (f.kind === 'dot'){
      f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 420 * dt;
    } else if (f.kind === 'text'){
      f.y -= 34 * dt;
    }
    if (f.t >= f.life) fx.splice(i, 1);
  }
}

// ================================================================= DRAWING
function drawMosquito(m){
  var s = m.scale;
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.scale(s, s);

  // orientation follows travel direction while flying
  var ang = 0;
  if (m.mode === 'fly' || m.mode === 'flee') ang = Math.atan2(m.vy, m.vx) * 0.28;
  ctx.rotate(ang);

  var biting = (m.mode === 'bite');

  /* Soft drop shadow, not a hard disc — it lifts the sprite off busy
     backgrounds without stamping a visible grey coin on open sky. */
  var sh = ctx.createRadialGradient(0, 3, 2, 0, 3, 24);
  sh.addColorStop(0,    biting ? 'rgba(180,20,30,.42)' : 'rgba(0,0,0,.34)');
  sh.addColorStop(0.55, biting ? 'rgba(180,20,30,.16)' : 'rgba(0,0,0,.13)');
  sh.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.beginPath(); ctx.arc(0, 3, 24, 0, 6.284); ctx.fill();

  // long dangling legs — the giveaway that this is a mosquito, not a fly
  ctx.strokeStyle = 'rgba(28,32,34,.95)';
  ctx.lineWidth = 1.3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  var legs = [
    [-3, 0,  -9, 10, -16,  6],
    [ 0, 1,  -3, 13,  -9, 17],
    [ 4, 1,   6, 12,   1, 18],
    [-3, 0,  -8, -7, -15, -9],
    [ 2, 0,   9, -6,  17, -3],
    [ 6, 1,  14,  4,  21, 12]
  ];
  for (var l = 0; l < legs.length; l++){
    var g0 = legs[l];
    ctx.beginPath();
    ctx.moveTo(g0[0], g0[1]);
    ctx.quadraticCurveTo(g0[2], g0[3], g0[4], g0[5]);
    ctx.stroke();
  }

  // wings: narrow, swept back over the abdomen, blurring as they beat
  var flap = Math.sin(m.wing) * 0.42;
  ctx.fillStyle = 'rgba(222,238,252,0.48)';
  ctx.strokeStyle = 'rgba(255,255,255,0.72)';
  ctx.lineWidth = 0.8;
  for (var w = -1; w <= 1; w += 2){
    ctx.save();
    ctx.translate(1, 0);
    ctx.rotate(w * (0.34 + flap) + 0.22);
    ctx.beginPath();
    ctx.ellipse(9, -3.5 * w, 12, 3.6, 0, 0, 6.284);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // slender abdomen, tapering to a point and angled up at the rear
  ctx.fillStyle = biting ? '#b02733' : '#39302a';
  ctx.beginPath();
  ctx.moveTo(2, -2.6);
  ctx.quadraticCurveTo(14, -6.5, 23, -8.5);
  ctx.quadraticCurveTo(15, -1.6, 2, 2.6);
  ctx.closePath();
  ctx.fill();
  // pale banding
  ctx.save();
  ctx.clip();
  ctx.fillStyle = 'rgba(238,230,214,.34)';
  for (var b = 0; b < 4; b++) ctx.fillRect(5 + b * 4.6, -10, 1.7, 20);
  ctx.restore();
  // a biter visibly fills with blood
  if (biting){
    ctx.fillStyle = 'rgba(228,40,54,.75)';
    ctx.beginPath(); ctx.ellipse(8, -3.4, 5.6, 3.1, -0.2, 0, 6.284); ctx.fill();
  }

  // thorax (humped) and head
  ctx.fillStyle = biting ? '#8f2029' : '#4a3f34';
  ctx.beginPath(); ctx.ellipse(0, 0, 5.4, 4.4, -0.15, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#2b2521';
  ctx.beginPath(); ctx.arc(-6.4, 0.4, 3.4, 0, 6.284); ctx.fill();
  ctx.fillStyle = '#c8443c';
  ctx.beginPath(); ctx.arc(-7.4, -0.8, 1.4, 0, 6.284); ctx.fill();

  // feathery antennae
  ctx.strokeStyle = 'rgba(40,36,32,.9)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-8, -1.4); ctx.quadraticCurveTo(-13, -7, -17, -8.5);
  ctx.moveTo(-8, 1.0);  ctx.quadraticCurveTo(-13, -3, -18, -3.5);
  ctx.stroke();

  // the long proboscis
  ctx.strokeStyle = '#1b1815'; ctx.lineWidth = 1.9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-8.6, 1.6); ctx.lineTo(-21, 5.4); ctx.stroke();

  ctx.restore();

  // bite countdown ring, drawn unscaled so it stays readable
  if (biting){
    var frac = Math.max(0, m.biteT / cfg.biteTime);
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(0, 0, 25, 0, 6.284); ctx.stroke();
    ctx.strokeStyle = frac < 0.35 ? '#ff3b3b' : '#ffb347';
    ctx.beginPath();
    ctx.arc(0, 0, 25, -Math.PI/2, -Math.PI/2 + 6.283 * frac);
    ctx.stroke();
    ctx.restore();
  }
}

/* Your forearm, laid across the lower third of the screen and running off both
   edges: unmistakably an arm, and it gives the bite zone a wide, flat landing
   strip that never drifts into Safari's bottom toolbar. */
function armPath(p, halfW, th){
  p.beginPath();
  p.moveTo(-halfW, -th * 0.86);
  p.quadraticCurveTo(-halfW * 0.30, -th * 1.06, halfW * 0.34, -th * 0.80);
  p.quadraticCurveTo( halfW * 0.80, -th * 0.66, halfW, -th * 0.58);
  p.lineTo(halfW, th * 0.62);
  p.quadraticCurveTo( halfW * 0.80,  th * 0.70,  halfW * 0.34,  th * 0.84);
  p.quadraticCurveTo(-halfW * 0.30,  th * 1.10, -halfW,  th * 0.92);
  p.closePath();
}

function drawArm(){
  var halfW = W * 0.62, th = arm.h;

  ctx.save();
  ctx.translate(arm.x, arm.y);
  ctx.rotate(-0.055);

  // soft contact shadow underneath
  ctx.fillStyle = 'rgba(0,0,0,.20)';
  ctx.beginPath();
  ctx.ellipse(0, th * 0.75, halfW * 0.94, th * 0.42, 0, 0, 6.284);
  ctx.fill();

  var skin = ctx.createLinearGradient(0, -th, 0, th);
  skin.addColorStop(0,    '#b8794f');
  skin.addColorStop(0.30, '#eec098');
  skin.addColorStop(0.58, '#e3ab7f');
  skin.addColorStop(1,    '#a06844');

  ctx.fillStyle = skin;
  armPath(ctx, halfW, th);
  ctx.fill();

  // clip everything else to the arm so nothing spills into the scene
  ctx.save();
  armPath(ctx, halfW, th);
  ctx.clip();

  // wrist crease near the right-hand end
  ctx.strokeStyle = 'rgba(126,76,46,.32)'; ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(halfW * 0.62, -th);
  ctx.quadraticCurveTo(halfW * 0.68, 0, halfW * 0.62, th);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(halfW * 0.71, -th);
  ctx.quadraticCurveTo(halfW * 0.77, 0, halfW * 0.71, th);
  ctx.stroke();

  // veins
  ctx.strokeStyle = 'rgba(112,84,124,.20)'; ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-halfW * 0.75, -th * 0.20);
  ctx.quadraticCurveTo(-halfW * 0.25, th * 0.22, halfW * 0.30, -th * 0.06);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-halfW * 0.40, th * 0.55);
  ctx.quadraticCurveTo(-halfW * 0.05, th * 0.18, halfW * 0.34, th * 0.38);
  ctx.stroke();

  // fine arm hair along the top edge
  ctx.strokeStyle = 'rgba(92,58,34,.34)'; ctx.lineWidth = 1;
  for (var i = 0; i < 46; i++){
    var hx = -halfW + (i / 45) * halfW * 2;
    var hy = -th * (0.72 + (i % 3) * 0.05);
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(hx + ((i % 2) ? 4 : -4), hy - 7);
    ctx.stroke();
  }

  if (armFlash > 0){
    ctx.globalAlpha = Math.min(0.6, armFlash * 1.4);
    ctx.fillStyle = '#ff3b30';
    ctx.fillRect(-halfW, -th * 1.2, halfW * 2, th * 2.4);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.restore();
}

function drawFx(){
  for (var i = 0; i < fx.length; i++){
    var f = fx[i], k = 1 - f.t / f.life;
    if (f.kind === 'dot'){
      ctx.globalAlpha = k;
      ctx.fillStyle = f.col;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * k + 0.6, 0, 6.284); ctx.fill();
    } else if (f.kind === 'ring'){
      ctx.globalAlpha = k * 0.9;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3 * k + 0.6;
      ctx.beginPath(); ctx.arc(f.x, f.y, 8 + (1 - k) * 34, 0, 6.284); ctx.stroke();
    } else if (f.kind === 'text'){
      ctx.globalAlpha = k;
      ctx.fillStyle = '#fff';
      ctx.font = '700 15px -apple-system,BlinkMacSystemFont,Helvetica,sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.strokeText(f.s, f.x, f.y);
      ctx.fillText(f.s, f.x, f.y);
    }
  }
  ctx.globalAlpha = 1;
}

function draw(){
  paintScene();

  var sx = 0, sy = 0;
  if (shake > 0.2){
    sx = (Math.random() - 0.5) * shake;
    sy = (Math.random() - 0.5) * shake;
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(sx, sy);

  // cached background (bg is in device pixels, so draw it in device space)
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, sx * dpr, sy * dpr);
  ctx.drawImage(bg, 0, 0);
  ctx.restore();

  drawArm();
  for (var i = 0; i < mosquitoes.length; i++) drawMosquito(mosquitoes[i]);
  drawFx();

  if (sceneFade > 0){
    ctx.globalAlpha = Math.min(1, sceneFade);
    ctx.fillStyle = '#06100d';
    ctx.fillRect(-40, -40, W + 80, H + 80);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// ================================================================= LOOP
function frame(t){
  rafId = requestAnimationFrame(frame);
  if (stageEl.clientWidth !== W || stageEl.clientHeight !== H) resize();
  if (!lastT) lastT = t;
  var dt = Math.min((t - lastT) / 1000, 0.05);   // clamp after tab switches
  lastT = t;

  if (state === 'playing'){
    spawnTimer -= dt;
    var remaining = cfg.quota - squashed;
    var slots = Math.min(cfg.concurrent, remaining);
    var alive = 0;
    for (var i = 0; i < mosquitoes.length; i++) if (mosquitoes[i].mode !== 'flee') alive++;
    if (spawnTimer <= 0 && alive < slots){
      spawnMosquito();
      spawnTimer = cfg.spawnGap;
    }
    updateMosquitoes(dt);
  }

  updateFx(dt);
  if (armFlash > 0)  armFlash  = Math.max(0, armFlash - dt * 1.6);
  if (shake > 0)     shake     = Math.max(0, shake - dt * 34);
  if (sceneFade > 0) sceneFade = Math.max(0, sceneFade - dt * 1.5);

  draw();
}

// ================================================================= INPUT
function tapAt(cx, cy){
  if (state !== 'playing') return;
  var r = canvas.getBoundingClientRect();
  var x = cx - r.left, y = cy - r.top;

  // pick the CLOSEST mosquito inside the forgiving radius, not the first match
  var best = null, bestD = HIT_RADIUS * HIT_RADIUS;
  for (var i = 0; i < mosquitoes.length; i++){
    var m = mosquitoes[i];
    if (m.mode === 'flee') continue;
    var dx = m.x - x, dy = m.y - y;
    var d2 = dx * dx + dy * dy;
    if (d2 <= bestD){ bestD = d2; best = i; }
  }

  if (best !== null){
    var hit = mosquitoes[best];
    mosquitoes.splice(best, 1);
    squash(hit);
  } else {
    combo = 0;                                   // a miss only costs the combo
    fx.push({ kind:'ring', x:x, y:y, t:0, life:0.22 });
  }
}

if (window.PointerEvent){
  canvas.addEventListener('pointerdown', function(e){
    e.preventDefault();
    tapAt(e.clientX, e.clientY);
  }, { passive:false });
} else {
  canvas.addEventListener('touchstart', function(e){
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++){
      tapAt(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
    }
  }, { passive:false });
  canvas.addEventListener('mousedown', function(e){
    e.preventDefault();
    tapAt(e.clientX, e.clientY);
  }, { passive:false });
}

// kill Safari's pinch-zoom and double-tap-zoom over the whole page
document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, { passive:false });
document.addEventListener('dblclick',     function(e){ e.preventDefault(); }, { passive:false });
document.addEventListener('touchmove', function(e){
  if (e.target === canvas) e.preventDefault();
}, { passive:false });

document.addEventListener('visibilitychange', function(){
  if (document.hidden && state === 'playing'){ state = 'paused'; showPause(); }
  lastT = 0;
});

// ================================================================= HUD
function renderHealth(){
  var html = '';
  for (var i = 0; i < MAX_HEALTH; i++){
    var on = i < health;
    html += '<span class="drop"><svg viewBox="0 0 11 15" aria-hidden="true">' +
            '<path d="M5.5 0C5.5 0 10.5 6.2 10.5 9.6A5 5 0 0 1 .5 9.6C.5 6.2 5.5 0 5.5 0Z" ' +
            'fill="' + (on ? '#ff4d5e' : 'rgba(255,255,255,.13)') + '"/></svg></span>';
  }
  elHealth.innerHTML = html;
}
function updateProgress(){
  elProg.style.width = Math.min(100, (squashed / cfg.quota) * 100) + '%';
}
function renderHud(){
  elLvl.textContent = level;
  elScore.textContent = score;
  var s = SCENES[(level - 1) % SCENES.length];
  elScene.textContent = s.name + (level > SCENES.length ? ' — Dusk' : '');
  renderHealth();
  updateProgress();
}

// ================================================================= FLOW
function showOverlay(html){
  card.innerHTML = html;
  overlay.classList.remove('hidden');
}
function hideOverlay(){ overlay.classList.add('hidden'); }

function showTitle(){
  state = 'title';
  level = 1; score = 0; health = MAX_HEALTH;
  squashed = 0; combo = 0; bestCombo = 0; totalSquashed = 0; bitesTaken = 0;
  cfg = levelConfig(1);
  mosquitoes = []; fx = [];
  renderHud();
  paintScene();
  showOverlay(
    '<span class="tag">Squash or be bitten</span>' +
    '<h1>Lorie\'s Mosquito<br>Squashing Game</h1>' +
    '<p class="sub">8 levels &middot; 4 buggy places</p>' +
    '<ul class="rules">' +
      '<li><span>👆</span>Tap a mosquito to squash it.</li>' +
      '<li><span>🩸</span>If one lands on your arm, a ring counts down. Swat it before the ring empties or you lose a drop of blood.</li>' +
      '<li><span>❤️</span>Five drops. Lose them all and the mosquitoes win.</li>' +
      '<li><span>🌍</span>Clear a level’s quota to move to the next place.</li>' +
    '</ul>' +
    '<button class="btn" id="btnStart">Start Swatting</button>' +
    '<div class="curve"><b>Difficulty per level L (1–8):</b><br>' +
    '<code>quota = 5 + 2(L-1) &nbsp; speed = 55 + 20(L-1) px/s<br>' +
    'onscreen = min(2 + ⌊0.8(L-1)⌋, 7)<br>' +
    'spawn gap = max(0.35, 1.40 - 0.14(L-1)) s<br>' +
    'bite timer = max(1.00, 2.40 - 0.18(L-1)) s</code></div>'
  );
  document.getElementById('btnStart').addEventListener('click', startLevel);
}

function startLevel(){
  hideOverlay();
  cfg = levelConfig(level);
  squashed = 0; combo = 0;
  mosquitoes = []; fx = [];
  spawnTimer = 0.35;
  sceneFade = 1;
  armFlash = 0; shake = 0;
  bgKey = '';
  renderHud();
  paintScene();
  state = 'playing';
  lastT = 0;
}

function levelClear(){
  state = 'levelclear';
  var bonus = health * 25 + bestCombo * 10;
  score += bonus;
  elScore.textContent = score;

  if (level >= TOTAL_LEVELS){ endGame(true); return; }

  var next = level + 1;
  var nc = levelConfig(next);
  var nextName = SCENES[(next - 1) % SCENES.length].name +
                 (next > SCENES.length ? ' — Dusk' : '');

  showOverlay(
    '<span class="tag">Level ' + level + ' cleared</span>' +
    '<h2>' + SCENES[(level - 1) % SCENES.length].name + ' is clear</h2>' +
    '<p class="sub">Next stop: <b style="color:#6ee7a8">' + nextName + '</b></p>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + cfg.quota + '</b><i>Squashed</i></div>' +
      '<div class="stat"><b>x' + bestCombo + '</b><i>Best combo</i></div>' +
      '<div class="stat"><b>+' + bonus + '</b><i>Bonus</i></div>' +
    '</div>' +
    '<button class="btn" id="btnNext">Go to ' + nextName + '</button>' +
    '<div class="curve">Level ' + next + ': <code>' + nc.quota + ' mosquitoes, ' +
    nc.speed + ' px/s, up to ' + nc.concurrent + ' at once, ' +
    nc.biteTime.toFixed(2) + 's to swat a biter.</code></div>'
  );
  document.getElementById('btnNext').addEventListener('click', function(){
    level++;
    if (health < MAX_HEALTH) health++;    // one drop back for clearing a level
    startLevel();
  });
}

function endGame(won){
  state = won ? 'win' : 'gameover';
  mosquitoes = [];
  renderHealth();
  showOverlay(
    '<span class="tag">' + (won ? 'You survived' : 'They got you') + '</span>' +
    '<h2>' + (won ? 'All 8 levels cleared 🏆' : 'Out of blood 🩸') + '</h2>' +
    '<p class="sub">' + (won
        ? 'Amsterdam to the treehouse, mosquito-free.'
        : 'You made it to level ' + level + ' — ' +
          SCENES[(level - 1) % SCENES.length].name + '.') + '</p>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + score + '</b><i>Score</i></div>' +
      '<div class="stat"><b>' + totalSquashed + '</b><i>Squashed</i></div>' +
      '<div class="stat"><b>' + bitesTaken + '</b><i>Bites</i></div>' +
    '</div>' +
    '<button class="btn" id="btnAgain">Play Again</button>'
  );
  document.getElementById('btnAgain').addEventListener('click', showTitle);
}

function showPause(){
  showOverlay(
    '<span class="tag">Paused</span>' +
    '<h2>Hold still…</h2>' +
    '<p class="sub">The mosquitoes are waiting.</p>' +
    '<button class="btn" id="btnResume">Resume</button>'
  );
  document.getElementById('btnResume').addEventListener('click', function(){
    hideOverlay(); state = 'playing'; lastT = 0;
  });
}

// ================================================================= BOOT
resize();
showTitle();
rafId = requestAnimationFrame(frame);

})();
</script>
</body>
</html>
