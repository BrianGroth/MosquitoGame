<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#163c32" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>Lorie's Mosquito Squashing Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="hud">
      <div id="hudRow">
        <button id="pauseBtn" class="icon-btn" aria-label="Pause game">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 5v14M15 5v14" />
          </svg>
        </button>
        <div class="hcell" style="flex: 1 1 auto">
          <span class="hlabel">Chapter <span id="lvlNum">1</span>/6 · Stage <span id="stageNum">1</span>/2</span>
          <span id="sceneName">Amsterdam Canal</span>
        </div>
        <div class="hcell" style="flex: 0 0 auto; align-items: center">
          <span class="hlabel">Score</span>
          <span class="hval" id="score">0</span>
        </div>
        <div class="hcell" id="healthCell" style="flex: 0 0 auto">
          <span class="hlabel">Health</span>
          <div id="health"></div>
        </div>
      </div>
      <div id="playMeta">
        <span id="quotaText">0 / 5 cleared</span
        ><span id="comboText">Ready to swat</span>
      </div>
      <div id="bandStatus" role="status"></div>
      <div id="progWrap"><div id="prog"></div></div>
    </header>

    <main id="stage">
      <canvas
        id="game"
        aria-label="Game area. Tap mosquitoes and red-eyed flies; draw a loop around spiders to weave webs."
      ></canvas>
      <div id="coach" hidden role="status"></div>
      <div id="toast" role="status" aria-live="polite"></div>

      <div id="overlay">
        <section
          class="card"
          id="card"
          tabindex="-1"
          aria-label="Game menu"
        ></section>
      </div>
    </main>

    <script src="progression.js"></script>
    <script src="game.js"></script>
  </body>
</html>
